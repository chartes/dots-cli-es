site_name: DoTS Search API
site_description: Elasticsearch indexing CLI and search API for TEI resources published with DoTS, powered by ThunderDots.
site_url: https://dots-suite.github.io/dots-cli-es/
repo_url: https://github.com/dots-suite/dots-cli-es
repo_name: dots-suite/dots-cli-es
edit_uri: edit/dev/mkdocs/docs/

docs_dir: docs
site_dir: site

use_directory_urls: true

theme:
  name: material
  language: en
  logo: assets/dots-logo-retro.drawio.png
  favicon: assets/dots-light.png
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: teal
    accent: teal
    toggle:
      icon: material/weather-night
      name: Switch to dark mode

  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: teal
    accent: teal
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - Configuration: configuration.md
  - Search fields: search-fields.md
  - Elasticsearch mappings: elasticsearch.md
  - Indexing: indexing.md
  - Indexing reports: reporting.md
  - Search API: search-api.md
  - CLI reference: cli-reference.md
  - Troubleshooting: troubleshooting.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dots-suite/dots-cli-es

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2026 DoTS Search API
